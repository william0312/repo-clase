[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "rock-al-parque-sentimiento"
version = "0.1.0"
authors = [
    {name = "William Mora"},
    {name = "Jorge Esau Tierradentro"},
]
description = "Análisis comparativo de la recepción digital de Rock al Parque (2023-2025) mediante análisis de sentimiento"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
]

[project.optional-dependencies]
data = [
    "gdown",
    "openpyxl",
]
nlp = [
    "torch",
    "transformers",
    "datasets",
    "emoji",
    "langdetect",
]

[tool.setuptools.packages.find]
where = ["src/"]
